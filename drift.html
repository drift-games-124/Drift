  disc(near,R,'#2b2b31');disc(near,R*.55,'#b9bcc4');disc(near,R*.2,'#555');
  const w=wr||0,sp=[0,3.1416,1.5708,4.7124].map(k=>pt(w+k,near,R*.5));
  if(sp.every(v=>v)){g.strokeStyle='#555';g.lineWidth=Math.max(1,1.6*sp[0].s);g.beginPath();g.moveTo(sp[0].x,sp[0].y);g.lineTo(sp[1].x,sp[1].y);g.moveTo(sp[2].x,sp[2].y);g.lineTo(sp[3].x,sp[3].y);g.stroke()}}
function gaugeHud(){
  const kmh=Math.round((car.sp||0)*.25),r=Math.min(72,c.height*.15),cx=c.width/2,cy=c.height-r-(TOUCH?12:36),A0=.75*Math.PI,A1=2.25*Math.PI,fr=Math.min(kmh/240,1);
  g.save();g.textAlign='center';
  g.fillStyle='rgba(0,0,0,.5)';g.beginPath();g.arc(cx,cy,r,0,7);g.fill();
  g.lineCap='round';g.lineWidth=7;g.strokeStyle='rgba(255,255,255,.2)';g.beginPath();g.arc(cx,cy,r-10,A0,A1);g.stroke();
  g.strokeStyle='hsl('+(120-fr*120)+',90%,55%)';g.beginPath();g.arc(cx,cy,r-10,A0,A0+(A1-A0)*Math.max(fr,.005));g.stroke();
  const an=A0+(A1-A0)*fr;g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(an)*(r-18),cy+Math.sin(an)*(r-18));g.stroke();
  g.fillStyle='#fff';g.font='bold '+Math.round(r*.4)+'px system-ui';g.fillText(kmh,cx,cy+r*.62);
  g.font=Math.round(r*.17)+'px system-ui';g.fillStyle='#bbb';g.fillText('km/h',cx,cy+r*.8);
  engHud();
  const sd=Math.round(Math.hypot(car.x-3500,car.y-6100)/10);if(sd>30&&!MODE){g.textAlign='center';g.fillStyle='#ffd23f';g.font='bold 15px system-ui';g.fillText('🏪 Loja de carros: '+sd+' m',c.width/2,106)}
  g.restore()}
